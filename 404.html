<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lost on the trail | Monster Trail 山海经</title><meta name="description" content="This page is not on the map."><meta name="color-scheme" content="light dark"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap"><style>
:root{--bg:#f4efe0;--panel:#fbf8ee;--ink:#1f1d1a;--muted:#5b5448;--seal:#b3261e;--jade:#1f6b50;
--line:#cfc6ae;--btn-ink:#fff;--art-bg:#f4efe0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171916;--panel:#21241f;--ink:#ede7d6;
--muted:#b9b29f;--seal:#e5776e;--jade:#25775a;--line:#3c4136;--btn-ink:#fff;--art-bg:#f4efe0}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Noto Serif SC",Georgia,"Songti SC",serif;
min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1,.zh{font-family:"Ma Shan Zheng","KaiTi","STKaiti","Kaiti SC",serif;font-weight:400}
h1{font-size:2.6rem;line-height:1.15;margin:.2em 0 .1em;color:var(--seal)}
h2{font-size:1.4rem;line-height:1.35;margin:.4em 0;font-weight:600}
.cn{font-family:"Noto Serif SC","Songti SC",serif}
.sub{color:var(--muted);margin:0 0 1.2em}
.top{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.95rem}
.seal{display:inline-block;background:var(--seal);color:#fff;font-family:"Ma Shan Zheng","KaiTi",serif;
font-size:1.2rem;line-height:1;padding:6px 7px;border-radius:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 16px}
.btn,button.btn{display:block;width:100%;min-height:48px;margin:10px 0;padding:12px 16px;text-align:left;
font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;
cursor:pointer}
.btn:hover{border-color:var(--jade)}
.btn:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
.primary{background:var(--jade);color:var(--btn-ink);border-color:var(--jade);text-align:center;
text-decoration:none;font-weight:600}
.primary:hover{border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.small{font-size:.9rem;color:var(--muted)}
.progress{height:6px;background:var(--line);border-radius:3px;margin:8px 0 18px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--seal);transition:width .25s}
select{font:inherit;width:100%;min-height:48px;padding:10px;color:var(--ink);background:var(--panel);
border:2px solid var(--line);border-radius:10px;margin:8px 0 16px}
.art{background:var(--art-bg);border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px}
.art img{width:min(100%,420px);height:auto;aspect-ratio:1;display:block;margin:0 auto}
.art video{width:min(100%,300px);height:auto;aspect-ratio:9/16;display:block;margin:0 auto;border-radius:8px;
background:var(--art-bg)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:4px 0 10px;margin:1em 0;scroll-snap-type:x proximity}
.strip a{flex:0 0 auto;width:120px;scroll-snap-align:start;border:1px solid var(--line);border-radius:8px;overflow:hidden;
line-height:0}
.strip video{width:100%;aspect-ratio:9/16;display:block;background:var(--art-bg)}
.name{font-size:3.4rem;line-height:1.1;margin:.3em 0 0;color:var(--ink)}
.names{margin:0 0 .6em;font-size:1.1rem}
.chip{display:inline-block;font-size:.8rem;border:1px solid var(--seal);color:var(--seal);padding:1px 8px;
border-radius:99px;margin-left:6px;vertical-align:middle}
.trait{font-size:1.2rem;margin:.6em 0}
.fortune{border-left:4px solid var(--seal);padding:6px 0 6px 14px;margin:1em 0;background:transparent}
.fortune b{color:var(--seal)}
.fortune .zh{font-size:1.5rem;display:block}
blockquote{margin:1em 0;padding:0}
blockquote .cn{font-size:1.25rem;line-height:1.8;display:block}
.store{display:block;text-align:center;padding:12px;border-radius:10px;border:2px solid var(--jade);
color:var(--jade);text-decoration:none;font-weight:600}
a.store:hover{background:var(--jade);color:#fff}
.store.off{border-style:dashed;color:var(--muted);border-color:var(--line)}
p.tester{margin:18px 0 0;text-align:center;font-size:.85rem;color:var(--muted)}
p.tester a{color:var(--jade);font-weight:600;display:inline-block;padding:10px 4px}
footer{margin-top:28px;color:var(--muted);font-size:.85rem;text-align:center}
[hidden]{display:none!important}
.l-zh,.l-zht{display:none}
html[data-lang=zh] .l-zh,html[data-lang=zht] .l-zht{display:inline}
html[data-lang=zh] .l-en,html[data-lang=zht] .l-en{display:none}
.langbtn{margin-left:auto;font:inherit;font-size:.9rem;min-height:44px;min-width:56px;padding:4px 14px;
color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:99px;cursor:pointer}
.langbtn:hover{border-color:var(--jade)}
.langbtn:focus-visible{outline:3px solid var(--seal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){h1{font-size:2.2rem}.name{font-size:2.8rem}}
</style></head><body><div class="wrap"><main><h1>迷路了</h1><p class="sub">This path is not on the map.</p><a class="btn primary" href="https://kaomilim.github.io/shanhai/index.html">Back to the quiz</a></main></div></body></html>
